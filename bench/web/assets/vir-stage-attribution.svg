<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-labelledby="title desc">
  <title id="title">VIR level-six production-stage attribution</title>
  <desc id="desc">Stacked bars compare matcher, base preparation, and remainder proxy shares for structured and seeded-random 64 KiB inputs. Matcher work accounts for 81.7 percent and 74.5 percent respectively.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #242721; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle, .axis, .note { font-size: 13px; fill: #5c6258; }
    .label { font-size: 15px; font-weight: 600; }
    .inside { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .value { font-size: 14px; font-weight: 600; }
  </style>
  <rect x="0.5" y="0.5" width="919" height="349" rx="12" fill="#fbfbf8" stroke="#d9ddd4"/>
  <text class="title" x="36" y="43">VIR level-6 stage attribution</text>
  <text class="subtitle" x="36" y="66">64 KiB warm production calls · share of whole-call wall time</text>

  <rect x="456" y="34" width="14" height="14" rx="2" fill="#d66b35"/>
  <text class="axis" x="478" y="46">matcher</text>
  <rect x="555" y="34" width="14" height="14" rx="2" fill="#3e8f87"/>
  <text class="axis" x="577" y="46">base preparation</text>
  <rect x="704" y="34" width="14" height="14" rx="2" fill="#aeb5aa"/>
  <text class="axis" x="726" y="46">remainder proxy</text>

  <text class="label" x="36" y="126">structured</text>
  <rect x="165" y="97" width="490.2" height="42" rx="5" fill="#d66b35"/>
  <rect x="655.2" y="97" width="22.2" height="42" fill="#3e8f87"/>
  <rect x="677.4" y="97" width="87.6" height="42" rx="5" fill="#aeb5aa"/>
  <text class="inside" x="410" y="123" text-anchor="middle">matcher 81.7%</text>
  <text class="value" x="786" y="123">236 ms</text>
  <text class="axis" x="165" y="158">base 3.7% · remainder 14.6%</text>

  <text class="label" x="36" y="220">seeded random</text>
  <rect x="165" y="191" width="447" height="42" rx="5" fill="#d66b35"/>
  <rect x="612" y="191" width="76.8" height="42" fill="#3e8f87"/>
  <rect x="688.8" y="191" width="76.2" height="42" rx="5" fill="#aeb5aa"/>
  <text class="inside" x="388.5" y="217" text-anchor="middle">matcher 74.5%</text>
  <text class="value" x="786" y="217">1,239 ms</text>
  <text class="axis" x="165" y="252">base 12.8% · remainder 12.8%</text>

  <line x1="36" y1="283" x2="884" y2="283" stroke="#d9ddd4"/>
  <text class="note" x="36" y="309">Attribution proxy from isolated stage calls; the remainder is whole − matcher − base.</text>
  <text class="note" x="36" y="329">It localizes the next experiment but is not an additive sampled profile.</text>
</svg>
